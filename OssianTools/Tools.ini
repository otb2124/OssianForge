; Tools.ini - settings for OssianTools: cook, build (command line > Tools.ini > built-in defaults).
; Relative paths are resolved from this file's folder (searching parent folders if not found there).

[App]
Name = My Game                  ; window title + product name   (required for build)
ExeName =                       ; exe file name without .exe    (default: Name without spaces)
Icon =                          ; .ico or .png (<= 256x256)     (empty = keep the engine's icon)
Version = 1.0.0.0
Company =
Copyright =
Description =                   ; file description              (default: Name)
Console = true                  ; false = no console window (see README: needs the debug console off)

[Engine]
Dir =                           ; folder with the built engine (empty = found automatically above the exe)

[Content]
Path = C:\Users\orest\Downloads\pojects\ossian_projects\myProject\Content   ; raw Content folder (cooked by `cook` and `build`)
Pak = Content.pak               ; pak file name inside the build
ResourcesConfigPath = ConfigFiles/Core/resources.json
TreeConfigPath = ConfigFiles/Core/tree.json   ; content-relative tree.json override (empty = from resources.json)
PrebuiltPak =                   ; use this pak instead of cooking

[Cook]
OutputPath = Content.pak        ; `cook` command only; `build` writes the pak into the game folder
CacheDir =                      ; default: <content parent>/.ossian/cache
NoCache = false
Compress = true
AllowErrors = false             ; write the pack even if some assets failed
Jobs = 0                        ; 0 = CPU count
Raw =                           ; comma-separated globs (see cook.json)
Scripts =
Exclude =

[Build]
Output = C:\Users\orest\Downloads\pojects\ossian_projects\myProject\dist   ; the game ends up in <Output>\<ExeName>\
Zip = false                     ; also write <Output>\<ExeName>-<Version>.zip
Exclude =                       ; extra comma-separated globs, added to the built-in list

[Redist]
Include = true
Path = Redist                   ; resolved with the same parent-folder search as other paths
Folder = redist                 ; name inside the game folder
