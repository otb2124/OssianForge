; OssianCooker settings. Lives in the OssianForge root.
; Relative paths are resolved from THIS file's folder, then its parent folders until the target exists
; (so the same file works in the solution root and in bin/Debug/net8.0/OssianCooker/). Absolute paths also work.
; Command-line options override these; these override Content/cook.json.

[Cook]
ContentPath         = C:\Users\orest\Downloads\pojects\ossian_projects\myProject\Content         ; raw content folder to cook
OutputPath          = C:\Users\orest\Downloads\pojects\ossian_projects\myProject\Content.pak     ; pak file to write
ResourcesConfigPath = ConfigFiles/Core/resources.json  ; inside ContentPath (must match Ossian.ini)
EngineDir           = bin/Debug/net8.0                 ; built engine (OssianForge.dll + deps), needed for scripts; empty = parent of the cooker folder
CacheDir            =                                  ; empty = <ContentPath parent>/.ossian/cache
NoCache             = false
Compress            = true                             ; LZ4
Jobs                = 0                                ; parallel imports, 0 = CPU count
AllowErrors         = false                            ; write the pak even if some assets fail

; Comma-separated globs, relative to ContentPath ( * within a folder, ** any depth, ? one char )
Raw                 = ConfigFiles/**                   ; copied into the pak verbatim
Scripts             = ScriptFiles/Packs                ; every .cs below is compiled to its own DLL
Exclude             = **/*.import.json