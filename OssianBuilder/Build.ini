; Build.ini - settings for OssianBuilder (command line > Build.ini > built-in defaults).
; Relative paths are resolved from this file's folder (searching parent folders if not found there).

[App]
Name = My Game                  ; window title + product name   (required)
ExeName =                       ; exe file name without .exe    (default: Name without spaces)
Icon =                          ; .ico or .png (<= 256x256)     (empty = keep the engine's icon)
Version = 1.0.0.0
Company =
Copyright =
Description =                   ; file description              (default: Name)
Console = true                  ; false = no console window (see README: needs the debug console off)

[Content]
Path = C:\Users\orest\Downloads\pojects\ossian_projects\myProject\Content                  ; raw Content folder that is cooked into the pak
Pak = Content.pak               ; pak file name inside the build
ResourcesConfigPath = ConfigFiles/Core/resources.json
TreeConfigPath		= ConfigFiles/Core/tree.json                          ; content-relative tree.json override (empty = from resources.json)
CookIni =                       ; optional Cook.ini handed to the cooker (--ini)
PrebuiltPak =                   ; use this pak instead of running the cooker
AllowCookErrors = false

[Build]
Template =                      ; folder with the built engine (empty = found automatically)
Output = C:\Users\orest\Downloads\pojects\ossian_projects\myProject\dist                   ; the game ends up in <Output>\<ExeName>\
Cooker =                        ; OssianCooker.exe (empty = <Template>\OssianCooker\OssianCooker.exe)
Zip = false                     ; also write <Output>\<ExeName>-<Version>.zip
Exclude =                       ; extra comma-separated globs, added to the built-in list